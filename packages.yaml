  - {name: eslint, prio: 2, note: "Neovim lints JavaScript with it"}
  - {name: ffmpeg, prio: 2, note: "yt-dlp merges video and audio with it"}
  - {name: gcloud-cli, cask: true, prio: 2, note: "Google Cloud CLI"}
  - {name: gh, prio: 2, note: "GitHub CLI; dotui's GitHub tab reads GitHub through it"}
