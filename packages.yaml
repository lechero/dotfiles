# Everything Homebrew installs for this setup, each with a priority. dotui and
# the Taskfile read this file: `task deps:install PRIO=2` installs priorities
# 1 and 2.
#
#   1  core       the dotfiles in this repo need it
#   2  daily      used regularly, or Neovim, fish or Rancher depend on it
#   3  sometimes  used in the last year, by a project, or by another package
#   4  rarely     not used in over a year: a candidate to remove
#
# Ranked in October 2026 from fish history, when apps were last opened, and
# what this repo and the projects in ~/projects call.
#
# Fields: name, prio, note, cask: true for casks, and app: for casks that
# may be installed without Homebrew. Packages from other taps use their
# tap-qualified name, such as charmbracelet/tap/crush; dotui taps those first.


packages:
