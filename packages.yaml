# Everything Homebrew installs for this setup, each with a priority. dotui and
# the Taskfile read this file: `task deps:install PRIO=2` installs priorities
# 1 and 2.
#
#   1  core       the dotfiles in this repo need it
#   2  daily      used regularly, or Neovim, fish or Rancher depend on it
#   3  sometimes  used in the last year, by a project, or by another package
#   4  rarely     not used in over a year: a candidate to remove
#
# Ranked in October 2026 from fish history, when apps were last opened, and
# what this repo and the projects in ~/projects call.
#
# Fields: name, prio, note, cask: true for casks, and app: for casks that
# may be installed without Homebrew. Packages from other taps use their
# tap-qualified name, such as charmbracelet/tap/crush; dotui taps those first.


packages:
  # 1 core
  - {name: bat, prio: 1, note: "Previews in fzf, and the `c` abbreviation"}
  - {name: chezmoi, prio: 1, note: "Applies this repo"}
  - {name: cmake, prio: 1, note: "update-neovim builds Neovim with it"}
  - {name: eza, prio: 1, note: "The `l` listing"}
  - {name: fd, prio: 1, note: "File search for fzf.fish, `vv` and Telescope"}
  - {name: fish, prio: 1, note: "Shell"}
  - {name: font-fira-code, cask: true, prio: 1, note: "kitty's font"}
  - {name: fzf, prio: 1, note: "Fuzzy finder in fish, zsh and Neovim"}
  - {name: gettext, prio: 1, note: "update-neovim builds Neovim with it"}
  - {name: go, prio: 1, note: "Builds dotui"}
  - {name: go-task, prio: 1, note: "Runs this repo's Taskfile, and your projects'"}
  - {name: jump, prio: 1, note: "`j` in fish"}
  - {name: kitty, cask: true, app: kitty.app, prio: 1, note: "Terminal; installed without Homebrew here"}
  - {name: ninja, prio: 1, note: "update-neovim builds Neovim with it"}
  - {name: ripgrep, prio: 1, note: "Search: `a`, `g`, `r` and Telescope"}
  - {name: starship, prio: 1, note: "zsh's prompt, and fish's other prompt"}
  - {name: tmux, prio: 1, note: "Terminal multiplexer that kitty starts"}
  - {name: zoxide, prio: 1, note: "`z` and `zi` in fish and zsh"}

  # 2 daily
