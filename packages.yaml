  - {name: lazydocker, prio: 2, note: "Docker TUI, `lz`"}
  - {name: lazygit, prio: 2, note: "Git TUI, `lg` and Neovim"}
  - {name: luarocks, prio: 2, note: "Lua packages for Neovim plugins"}
  - {name: maven, prio: 2, note: "Java builds, also from Neovim"}
