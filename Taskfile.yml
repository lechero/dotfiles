# Set up and check this machine. `task` lists the tasks.
#
# Package tasks take PRIO (default 2): 1 core, 2 daily, 3 sometimes,
# 4 rarely, as set in packages.yaml. For example: task deps:install PRIO=3
#
# The dotfiles tasks run chezmoi against its own source directory, except
# dotfiles:preview, which shows what applying this checkout would change.
version: "3"

vars:
  PRIO: 2
  DOTUI: "{{.ROOT_DIR}}/apps/bin/dotui"
  DISK: "{{.ROOT_DIR}}/apps/bin/manage-disk"
  PACKAGES: "{{.ROOT_DIR}}/packages.yaml"
  STYLUA: "{{.HOME}}/.local/share/nvim/mason/bin/stylua"

tasks:
  default:
    desc: List the tasks
    silent: true
    cmd: task --list

  install:
    desc: Set up this machine - install packages up to PRIO, then apply the dotfiles
    cmds:
      - task: deps:install
      - task: dotfiles:apply

  check:
    desc: Check packages up to PRIO, and what applying the dotfiles would change
    cmds:
      - task: deps:check
      - task: dotfiles:status

  deps:check:
    desc: Fail if a package up to PRIO is missing
    deps: [apps:build]
    cmd: "{{.DOTUI}} check --file {{.PACKAGES}} --prio {{.PRIO}}"

  deps:install:
    desc: Install the missing packages up to PRIO
    deps: [apps:build]
    interactive: true
    cmd: "{{.DOTUI}} install --file {{.PACKAGES}} --prio {{.PRIO}}"

  deps:list:
    desc: List every package with its priority and install state (task deps:list -- --missing)
    deps: [apps:build]
    cmd: "{{.DOTUI}} list --file {{.PACKAGES}} {{.CLI_ARGS}}"

  dotfiles:status:
    desc: Show what chezmoi apply would change
    cmd: chezmoi status

  dotfiles:diff:
    desc: Show the diff chezmoi apply would make
    interactive: true
    cmd: chezmoi diff

  dotfiles:preview:
    desc: Show what applying this checkout would change, before it's merged
    interactive: true
    cmd: chezmoi diff --source {{.ROOT_DIR}}

  dotfiles:apply:
    desc: Apply the dotfiles
    interactive: true
    cmd: chezmoi apply

  dotfiles:update:
    desc: Pull the latest dotfiles and apply them
    interactive: true
    cmd: chezmoi update

  dotui:
    desc: Open dotui
    deps: [apps:build]
    interactive: true
    cmd: "{{.DOTUI}} --file {{.PACKAGES}}"

  disk:
    desc: Open manage-disk; it cleans for real after you confirm
    deps: [apps:build]
    interactive: true
    cmd: "{{.DISK}} {{.CLI_ARGS}}"

  disk:dry:
    desc: Open manage-disk with deletion switched off
    deps: [apps:build]
    interactive: true
    cmd: "{{.DISK}} --dry-run {{.CLI_ARGS}}"

  disk:report:
    desc: Print the disk overview and cleanup plan, changing nothing (task disk:report -- -v lists every item)
    deps: [apps:build]
    cmd: "{{.DISK}} report {{.CLI_ARGS}}"

  disk:worktrees:
    desc: List every git worktree with a verdict, changing nothing (task disk:worktrees -- --fetch checks against today's main)
    deps: [apps:build]
    cmd: "{{.DISK}} worktrees {{.CLI_ARGS}}"

  disk:docker:
    desc: "Docker's own disk, a verdict on everything in it, and the cheapest way to 22 GiB free (task disk:docker -- --target 30), changing nothing"
    deps: [apps:build]
    cmd: "{{.DISK}} docker {{.CLI_ARGS}}"

  disk:logs:
    desc: Show today's manage-disk cleanup log
    cmd: cat "$HOME/Library/Logs/manage-disk/$(date +%F).log"

  apps:build:
    desc: Build dotui and manage-disk into apps/bin
    dir: apps
    sources: ["**/*.go", go.mod, go.sum]
    generates: [bin/dotui, bin/manage-disk]
    cmd: go build -o bin/ ./cmd/...

  apps:install:
    desc: Install dotui and manage-disk into ~/.local/bin
    dir: apps
    cmd: go build -o "$HOME/.local/bin/" ./cmd/...

  apps:test:
    desc: Vet, test and lint dotui and manage-disk
    dir: apps
    cmds:
      - go vet ./...
      - go test -race ./...
      - golangci-lint run ./...

  lint:
    desc: Lint the shell scripts, fish files, Neovim Lua and the Go apps
    deps: [lint:shell, lint:fish, lint:lua, apps:test]

  lint:shell:
    desc: shellcheck the scripts and the rendered chezmoi run scripts
    cmds:
      - shellcheck -S warning scripts/*.sh private_dot_local/bin/executable_*
      - for: { var: RUN_SCRIPTS }
        cmd: chezmoi execute-template --source {{.ROOT_DIR}} < {{.ITEM}} | shellcheck -
    vars:
      RUN_SCRIPTS:
        sh: ls run_*.sh.tmpl

  lint:fish:
    desc: Check fish syntax and formatting
    cmds:
      - for: { var: FISH_FILES }
        cmd: fish --no-execute {{.ITEM}}
      # The copilot completions are generated by copilot, so they're left as is.
      - fish_indent --check $(find dot_config/fish -name '*.fish' ! -path '*/completions/copilot.fish')
    vars:
      FISH_FILES:
        sh: find dot_config/fish -name '*.fish'

  lint:lua:
    desc: Check the Neovim config's formatting with stylua, and that it loads
    cmds:
      - "{{.STYLUA}} --check --config-path dot_config/nvim/dot_stylua.toml dot_config/nvim"
      - nvim --headless -u dot_config/nvim/init.lua +qall
