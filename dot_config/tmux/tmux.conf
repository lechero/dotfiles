# tmux config. TPM installs the plugins below into ~/.config/tmux/plugins,
# which isn't tracked; chezmoi runs TPM's installer whenever this list changes.
# prefix + I installs plugins by hand, prefix + U updates them.

# Prefix: ctrl-space
unbind-key C-b
set -g prefix C-Space
bind-key C-Space send-prefix

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'abhinav/tmux-fastcopy'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'jimeh/tmuxifier'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'carlocab/tmux-nvr'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'catppuccin/tmux'

set -g @catppuccin_flavor 'mocha'
set -g @sessionx-bind 'r'
set -g @yank_action 'copy-pipe'

# screen-256color, since macOS's own terminfo has no tmux-256color. kitty
# reports itself as xterm-256color, which can show true color.
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

set -g default-shell /opt/homebrew/bin/fish
set -g default-command /opt/homebrew/bin/fish

# Number windows and panes from 1
set -g base-index 1
setw -g pane-base-index 1

set -g set-titles on
setw -g automatic-rename on
setw -g monitor-activity on
set -g mouse on
set -g history-limit 10000
set -g status-keys vi
setw -g mode-keys vi

bind-key -T prefix v copy-mode

# Everything below works without the prefix.

# Sessions: alt-r picks one, alt-e opens the dotfiles session and alt-y the
# dash session in a popup, and the same key closes the popup again.
bind -n M-r run-shell '~/.config/tmux/plugins/tmux-sessionx/scripts/sessionx.sh search'
bind -n M-e if-shell -F '#{==:#{session_name},cfg}' { detach-client } { display-popup -w 94% -h 90% -E 'tmux new-session -A -c "$HOME/dotfiles" -n dotfiles -s cfg' }
bind -n M-y if-shell -F '#{==:#{session_name},dash}' { detach-client } { display-popup -w 94% -h 90% -E 'tmux new-session -A -s dash' }
bind -n M-d detach

# Windows
bind -n M-t new-window -c '#{pane_current_path}'
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-. next-window
bind -n M-, previous-window
bind -n S-Right next-window
bind -n S-Left previous-window
bind -n C-Tab next-window
bind -n C-S-Tab previous-window
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -n M-0 select-window -t :=0

# Panes
bind -n M-s split-window -c '#{pane_current_path}'
bind -n M-v split-window -h -c '#{pane_current_path}'
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-H select-pane -L
bind -n M-J select-pane -D
bind -n M-K select-pane -U
bind -n M-L select-pane -R
bind -n M-w last-pane
bind -n M-z resize-pane -Z
bind -n M-Up resize-pane -U 2
bind -n M-Down resize-pane -D 2
bind -n M-Left resize-pane -L 2
bind -n M-Right resize-pane -R 2
bind -n M-f next-layout
bind -n M-o rotate-window
bind -n M-O rotate-window

bind -n M-? list-keys

run '~/.config/tmux/plugins/tpm/tpm'
